services:
  mpga:
    build:
      context: .
      dockerfile: Dockerfile
    image: mpga:local
    container_name: mpga
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-7200}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      REPORTS_DIR: /var/lib/mpga/reports
      REPORTS_ENABLED: "${REPORTS_ENABLED:-1}"
      REPORTS_ORIGIN: "${REPORTS_ORIGIN:-}"
    volumes:
      # Присланные людьми презентации. Каталог на хосте принадлежит uid 1000 —
      # тому же, под которым работает процесс в контейнере (пользователь bun),
      # иначе запись падала бы на правах. Том нужен и затем, чтобы счётчик
      # суточных лимитов переживал пересборку контейнера.
      - /media/mpga/reports:/var/lib/mpga/reports
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - "CMD"
        - "bun"
        - "-e"
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
